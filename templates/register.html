<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='image/favicon-32.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='image/favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='image/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Register - HealthCareAI</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="wrapper">
    <div class="login_box">
      <div class="login_header">
        <span>Register</span>
      </div>
      
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
              {% for category, message in messages %}
                  <div class="flash-message {{ category }}">
                      {{ message }}
                  </div>
              {% endfor %}
          {% endif %}
      {% endwith %}

      <form id="customRegisterForm">
        <!-- Username -->
        <div class="input_box">
          <input type="text" id="username" class="input-field" required>
          <label for="username" class="label">Username</label>
          <i class="bx bx-user icon"></i>
        </div>

        <!-- Full Name -->
        <div class="input_box">
          <input type="text" id="fullname" class="input-field" required>
          <label for="fullname" class="label">Full Name</label>
          <i class="bx bx-user-circle icon"></i>
        </div>

        <!-- Email -->
        <div class="input_box">
          <input type="email" id="email" class="input-field" required>
          <label for="email" class="label">Email</label>
          <i class="bx bx-envelope icon"></i>
        </div>

        <!-- Password -->
        <div class="input_box">
          <input type="password" id="password" class="input-field" required>
          <label for="password" class="label">Password</label>
          <i class="bx bx-lock-alt icon"></i>
        </div>

        <!-- Confirm Password -->
        <div class="input_box">
          <input type="password" id="confirm_password" class="input-field" required>
          <label for="confirm_password" class="label">Confirm Password</label>
          <i class="bx bx-lock icon"></i>
        </div>

        <!-- Terms and Conditions -->
        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="{{ url_for('terms') }}" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a></label>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="input_box">
          <button type="submit" class="input-submit">Register</button>
        </div>

        <div class="auth-oauth-below">
          <div class="google-signin">
            <button type="button" id="googleSignUp" class="google-btn">
              <i class="bx bxl-google"></i>
              Sign up with Google
            </button>
          </div>
        </div>
      </form>

      <!-- Redirect to Login -->
      <div class="register">
        <span>Already have an account? <a href="{{ url_for('login') }}">Login here</a></span>
      </div>
      
    </div>
  </div>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {{ firebase_config | tojson }};
    
    console.log('Firebase Config:', firebaseConfig);
    
    // Declare variables in global scope
    let auth;
    let googleProvider;
    
    // Initialize Firebase
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      console.log('Firebase initialized successfully');
      
      // Google Sign In
      googleProvider = new firebase.auth.GoogleAuthProvider();
    } catch (error) {
      console.error('Firebase initialization error:', error);
      showError('Firebase initialization failed: ' + error.message);
    }
    
    // Wait for DOM to be fully loaded before adding event listeners
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, adding event listeners');
      
      // Registration form submission
      document.getElementById('customRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Get the submit button and disable it to prevent multiple submissions
        const submitButton = e.target.querySelector('button[type="submit"]');
        const originalText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = 'Registering...';
        submitButton.style.opacity = '0.6';
        submitButton.style.cursor = 'not-allowed';
        
        const username = document.getElementById('username').value;
        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const terms = document.getElementById('terms').checked;
      
        // Function to re-enable the button
        const reEnableButton = () => {
          submitButton.disabled = false;
          submitButton.textContent = originalText;
          submitButton.style.opacity = '1';
          submitButton.style.cursor = 'pointer';
        };
        
        // Validation
        if (password !== confirmPassword) {
          showError('Passwords do not match!');
          reEnableButton();
          return;
        }
        
        if (password.length < 6) {
          showError('Password must be at least 6 characters long!');
          reEnableButton();
          return;
        }
        
        if (!terms) {
          showError('You must accept the Terms & Conditions!');
          reEnableButton();
          return;
        }
        
        if (!/^[a-zA-Z0-9_]{3,80}$/.test(username)) {
          showError('Username: 3–80 characters, letters, numbers, and underscores only.');
          reEnableButton();
          return;
        }
        try {
          if (!auth) {
            showError('Firebase authentication not initialized');
            reEnableButton();
            return;
          }
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await cred.user.updateProfile({ displayName: fullname });
          const idToken = await cred.user.getIdToken(true);
          const response = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              authType: 'firebase',
              idToken: idToken,
              fullname: fullname,
              username: username
            })
          });
          const result = await response.json();
          if (result.success) {
            window.location.href = '/home';
          } else {
            try { await cred.user.delete(); } catch (e) {}
            try { await auth.signOut(); } catch (e) {}
            showError(result.error || 'Registration failed');
            reEnableButton();
          }
        } catch (error) {
          console.error('Registration error:', error);
          const code = error.code || '';
          let msg = error.message || 'Registration failed';
          if (code === 'auth/email-already-in-use') {
            msg = 'This email is already registered in Firebase. Try logging in.';
          } else if (code === 'auth/weak-password') {
            msg = 'Password is too weak. Use at least 6 characters.';
          } else if (code === 'auth/invalid-email') {
            msg = 'Invalid email address.';
          }
          showError(msg);
          reEnableButton();
        }
      });
    
      // Google Sign Up
      document.getElementById('googleSignUp').addEventListener('click', async () => {
        const googleButton = document.getElementById('googleSignUp');
        const originalText = googleButton.innerHTML;
        
        // Disable button during Google sign-up
        googleButton.disabled = true;
        googleButton.innerHTML = '<i class="bx bxl-google"></i> Signing up...';
        googleButton.style.opacity = '0.6';
        googleButton.style.cursor = 'not-allowed';
        
        const reEnableGoogleButton = () => {
          googleButton.disabled = false;
          googleButton.innerHTML = originalText;
          googleButton.style.opacity = '1';
          googleButton.style.cursor = 'pointer';
        };
        
        try {
          if (!auth || !googleProvider) {
            showError('Firebase authentication not initialized');
            reEnableGoogleButton();
            return;
          }
          
          const result = await auth.signInWithPopup(googleProvider);
          const idToken = await result.user.getIdToken();
          
          // Send token to backend
          const response = await fetch('/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ 
              authType: 'firebase',
              idToken: idToken,
              fullname: result.user.displayName || ''
            })
          });
          
          const registerResult = await response.json();
          
          if (registerResult.success) {
            // Keep button disabled on success since we're redirecting
            window.location.href = '/home';
          } else {
            showError(registerResult.error || 'Google sign-up failed');
            reEnableGoogleButton();
          }
        } catch (error) {
          console.error('Google sign-up error:', error);
          showError(error.message);
          reEnableGoogleButton();
        }
      });
    });
    
    // Show error messages (moved outside try-catch)
    function showError(message) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'flash-message error';
      errorDiv.textContent = message;
      
      const form = document.getElementById('customRegisterForm');
      if (form) {
        form.parentNode.insertBefore(errorDiv, form);
        
        setTimeout(() => {
          errorDiv.remove();
        }, 5000);
      }
    }
  </script>
  
  <script src="{{ url_for('static', filename='custom.js') }}"></script>
</body>
</html>
