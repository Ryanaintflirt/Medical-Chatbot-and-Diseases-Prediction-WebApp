version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Flask Configuration
      - FLASK_APP=app.py
      - FLASK_ENV=production
      # Required in production: session-signing key (generate with `openssl rand -hex 32`)
      - SECRET_KEY=${SECRET_KEY}
      # Optional: enables the /init-db and /populate-doctors maintenance routes when set
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      
      # Firebase Configuration (provide these values)
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      
      # AI API Configuration (provide these values)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      
      # Optional: Pinecone (if using vector database)
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      
      # Optional: Azure API for symptom checker
      - url=${AZURE_SYMPTOM_API_URL:-}
      - DapiKey=${AZURE_SYMPTOM_API_KEY:-}
    
    volumes:
      # Persist database
      - ./instance:/app/instance
      # Persist models
      - ./saved_models:/app/saved_models
      # Persist data
      - ./data:/app/data
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
